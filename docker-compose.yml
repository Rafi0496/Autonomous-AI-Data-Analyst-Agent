version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: analyst_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-analyst_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analyst_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - analyst_network

  redis:
    image: redis:7-alpine
    container_name: analyst_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - analyst_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: analyst_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=dev
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/analyst_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=dev-secret-key-do-not-use-in-production-2026
      - LLM_PROVIDER=heuristic
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=analyst_db
      - POSTGRES_PORT=5432
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    networks:
      - analyst_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: analyst_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000/api/v1
    ports:
      - "3000:3000"
    networks:
      - analyst_network

volumes:
  postgres_data:

networks:
  analyst_network:
    driver: bridge
