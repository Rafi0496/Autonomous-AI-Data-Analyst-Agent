name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  offline-tests:
    name: Offline Tests (Heuristic LLM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Offline Suite
        env:
          LLM_PROVIDER: heuristic
        run: |
          pytest -m "not live" --tb=short

  docker-build:
    name: Docker Compose Build & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Services
        run: docker compose build

      - name: Start Database, Cache and Backend
        run: docker compose up -d postgres redis backend

      - name: Verify Backend /health Endpoint
        run: |
          timeout=60
          while [ $timeout -gt 0 ]; do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend is healthy!"
              curl -s http://localhost:8000/health
              exit 0
            fi
            echo "Waiting for backend health check ($timeout seconds remaining)..."
            sleep 3
            timeout=$((timeout - 3))
          done
          echo "Backend health check timed out!"
          docker compose logs backend
          exit 1

      - name: Tear Down Services
        if: always()
        run: docker compose down -v
