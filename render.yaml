services:
  # 1. FastAPI Backend API Service
  - type: web
    name: autonomous-ai-data-analyst-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./data/app.db
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: ALLOW_ANONYMOUS
        value: "True"

  # 2. Reflex Frontend UI Service
  - type: web
    name: autonomous-ai-data-analyst-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: API_URL
        value: https://autonomous-ai-data-analyst-backend.onrender.com/api/v1
