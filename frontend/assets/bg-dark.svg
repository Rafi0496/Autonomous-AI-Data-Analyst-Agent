<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Soft Ambient Glass Occlusion Shadow for Dark Theme -->
    <filter id="glass-shadow-dark" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#000000" flood-opacity="0.80"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.60"/>
    </filter>

    <!-- Center Node Shadow -->
    <filter id="node-shadow-dark" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.90"/>
    </filter>

    <!-- Top-Left Glass Body: Smoked Obsidian Crystal Glass -->
    <radialGradient id="glass-body-tl-dark" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#383D4D" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#242834" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#181A22" stop-opacity="0.55"/>
      <stop offset="90%" stop-color="#12131A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0A0B0F" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Bottom-Right Glass Body: Smoked Obsidian Crystal Glass -->
    <radialGradient id="glass-body-br-dark" cx="65%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#383D4D" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#242834" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#181A22" stop-opacity="0.55"/>
      <stop offset="90%" stop-color="#12131A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0A0B0F" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Outer Chamfer Bevel Rim: 3D Crystal Light Edge -->
    <linearGradient id="glass-rim-tl-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.90"/>
      <stop offset="30%" stop-color="#94A3B8" stop-opacity="0.60"/>
      <stop offset="70%" stop-color="#475569" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="glass-rim-br-dark" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.90"/>
      <stop offset="30%" stop-color="#94A3B8" stop-opacity="0.60"/>
      <stop offset="70%" stop-color="#475569" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Inner 14px Glass Bevel Highlight Rim -->
    <linearGradient id="inner-bevel-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.60"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0.30"/>
    </linearGradient>

    <!-- Specular Crescent Glare Gradient -->
    <linearGradient id="specular-glare-dark" x1="0%" y1="0%" x2="60%" y2="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.60"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- 1. Pure Obsidian Charcoal Canvas -->
  <rect width="100%" height="100%" fill="#09090B"/>

  <!-- 2. Top-Left Glass Circle Structure (cx: 500, cy: 180, r: 584) - Meets at (960, 540) -->
  <g filter="url(#glass-shadow-dark)">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 8,5; -4,3; 0,0" dur="14s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"/>
    
    <!-- Smoked Crystal Glass Base -->
    <circle cx="500" cy="180" r="584" fill="url(#glass-body-tl-dark)" stroke="url(#glass-rim-tl-dark)" stroke-width="3.2"/>

    <!-- 14px Polished Inner Chamfer Rim -->
    <circle cx="500" cy="180" r="570" fill="none" stroke="url(#inner-bevel-dark)" stroke-width="1.8"/>

    <!-- Concentric Optical Glass Ring 1 (Ribbed) -->
    <circle cx="500" cy="180" r="420" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-opacity="0.35" stroke-dasharray="14 8"/>

    <!-- Concentric Optical Glass Ring 2 (Groove) -->
    <circle cx="500" cy="180" r="270" fill="none" stroke="#64748B" stroke-width="1.2" stroke-opacity="0.28"/>

    <!-- Concentric Core Ring -->
    <circle cx="500" cy="180" r="130" fill="none" stroke="#475569" stroke-width="1.0" stroke-opacity="0.22"/>

    <!-- Specular Glass Surface Glare Arc -->
    <path d="M 120 180 A 380 380 0 0 1 760 -100" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.65"/>
    <ellipse cx="440" cy="120" rx="340" ry="180" fill="url(#specular-glare-dark)" transform="rotate(-20 440 120)"/>
  </g>

  <!-- 3. Bottom-Right Glass Circle Structure (cx: 1420, cy: 900, r: 584) - Meets at (960, 540) -->
  <g filter="url(#glass-shadow-dark)">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -8,-5; 4,-3; 0,0" dur="14s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- Smoked Crystal Glass Base -->
    <circle cx="1420" cy="900" r="584" fill="url(#glass-body-br-dark)" stroke="url(#glass-rim-br-dark)" stroke-width="3.2"/>

    <!-- 14px Polished Inner Chamfer Rim -->
    <circle cx="1420" cy="900" r="570" fill="none" stroke="url(#inner-bevel-dark)" stroke-width="1.8"/>

    <!-- Concentric Optical Glass Ring 1 (Ribbed) -->
    <circle cx="1420" cy="900" r="420" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-opacity="0.35" stroke-dasharray="14 8"/>

    <!-- Concentric Optical Glass Ring 2 (Groove) -->
    <circle cx="1420" cy="900" r="270" fill="none" stroke="#64748B" stroke-width="1.2" stroke-opacity="0.28"/>

    <!-- Concentric Core Ring -->
    <circle cx="1420" cy="900" r="130" fill="none" stroke="#475569" stroke-width="1.0" stroke-opacity="0.22"/>

    <!-- Specular Glass Surface Glare Arc -->
    <path d="M 1800 900 A 380 380 0 0 1 1160 1180" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.65"/>
    <ellipse cx="1480" cy="960" rx="340" ry="180" fill="url(#specular-glare-dark)" transform="rotate(160 1480 960)"/>
  </g>

  <!-- 4. Central Optical Refraction Kiss Node (Exactly at 960, 540 where the two circles meet) -->
  <g filter="url(#node-shadow-dark)">
    <circle cx="960" cy="540" r="22" fill="#18181B" fill-opacity="0.95" stroke="#94A3B8" stroke-width="2.5"/>
    <circle cx="960" cy="540" r="14" fill="#27272A" stroke="#CBD5E1" stroke-width="1.5" stroke-opacity="0.70"/>
    <circle cx="960" cy="540" r="5" fill="#7FB3B8" fill-opacity="0.95"/>
  </g>
</svg>
