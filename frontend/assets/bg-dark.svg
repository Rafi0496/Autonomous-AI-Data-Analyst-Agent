<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Cosmic Dark Background Canvas -->
    <linearGradient id="cosmic-dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06030F"/>
      <stop offset="35%" stop-color="#0D061F"/>
      <stop offset="70%" stop-color="#16082B"/>
      <stop offset="100%" stop-color="#080214"/>
    </linearGradient>

    <!-- Gaussian Blur Filters for Neon Rim Glow -->
    <filter id="neon-glow-ruby" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-glow-sapphire" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambient-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <!-- 1. Ruby / Coral Sphere (Center-Left) Radial Gradient -->
    <radialGradient id="ruby-orb-grad" cx="68%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#FF5B65" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#E91E63" stop-opacity="0.90"/>
      <stop offset="55%" stop-color="#9C0A4E" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#56032E" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#220015" stop-opacity="0.92"/>
    </radialGradient>

    <!-- Ruby Specular Rim Gradient (Top-Right Arc) -->
    <linearGradient id="ruby-rim-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A59" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#FF2A6D" stop-opacity="1.0"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#FCE7F3" stop-opacity="0.90"/>
    </linearGradient>

    <!-- 2. Sapphire / Indigo Sphere (Right & Bottom-Right) Radial Gradient -->
    <radialGradient id="sapphire-orb-grad" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.90"/>
      <stop offset="20%" stop-color="#3B82F6" stop-opacity="0.85"/>
      <stop offset="48%" stop-color="#4F46E5" stop-opacity="0.80"/>
      <stop offset="75%" stop-color="#2E1065" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0D0424" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Sapphire Specular Rim Gradient (Upper Arc) -->
    <linearGradient id="sapphire-rim-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#67E8F9" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.90"/>
    </linearGradient>

    <!-- 3. Upper Top-Left Orb Gradient -->
    <radialGradient id="top-orb-grad" cx="50%" cy="85%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#3B82F6" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#1E1B4B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0A031E" stop-opacity="0.90"/>
    </radialGradient>

    <linearGradient id="top-rim-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.90"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1.0"/>
    </linearGradient>

    <!-- Subtle Ambient Caustics Bloom -->
    <radialGradient id="caustic-ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#DB2777" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <!-- 1. Background Cosmic Void Canvas -->
  <rect width="100%" height="100%" fill="url(#cosmic-dark-bg)"/>

  <!-- Ambient Light Bloom behind the intersection -->
  <circle cx="960" cy="540" r="600" fill="url(#caustic-ambient-glow)"/>

  <!-- 2. Orb 1: Upper-Left Peeking Orb (cx: 460, cy: -60, r: 420) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 6,4; -3,2; 0,0" dur="18s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"/>
    
    <!-- Body -->
    <circle cx="460" cy="-60" r="420" fill="url(#top-orb-grad)"/>

    <!-- Luminous Edge Rim -->
    <path d="M 120 180 A 420 420 0 0 0 880 -60" fill="none" stroke="url(#top-rim-grad)" stroke-width="3.5" filter="url(#neon-glow-sapphire)"/>
    <path d="M 120 180 A 420 420 0 0 0 880 -60" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-opacity="0.95"/>
  </g>

  <!-- 3. Orb 2: Dominant Sapphire / Indigo Glass Orb (Right & Bottom-Right) -->
  <g filter="url(#ambient-shadow)">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -10,-7; 5,-4; 0,0" dur="16s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- Sphere Body (cx: 1420, cy: 780, r: 640) -->
    <circle cx="1420" cy="780" r="640" fill="url(#sapphire-orb-grad)"/>

    <!-- Inner Refraction Depth Ring -->
    <circle cx="1420" cy="780" r="622" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2"/>

    <!-- Ultra-Crisp Luminous Neon Cyan-White Rim Light along the upper curved crest -->
    <path d="M 780 780 A 640 640 0 0 1 1980 440" fill="none" stroke="url(#sapphire-rim-grad)" stroke-width="4.5" filter="url(#neon-glow-sapphire)"/>
    <path d="M 780 780 A 640 640 0 0 1 1980 440" fill="none" stroke="#FFFFFF" stroke-width="2.0" stroke-linecap="round"/>
  </g>

  <!-- 4. Orb 3: Dominant Ruby / Coral Glass Orb (Center-Left) -->
  <g filter="url(#ambient-shadow)">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 10,7; -5,4; 0,0" dur="16s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- Sphere Body (cx: 460, cy: 460, r: 520) -->
    <circle cx="460" cy="460" r="520" fill="url(#ruby-orb-grad)"/>

    <!-- Inner Refraction Depth Ring -->
    <circle cx="460" cy="460" r="504" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1.2"/>

    <!-- Razor-Sharp Luminous Neon Magenta-Coral Rim Light along the upper-right arc -->
    <path d="M 160 880 A 520 520 0 0 0 980 460" fill="none" stroke="url(#ruby-rim-grad)" stroke-width="5.0" filter="url(#neon-glow-ruby)"/>
    <path d="M 160 880 A 520 520 0 0 0 980 460" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
