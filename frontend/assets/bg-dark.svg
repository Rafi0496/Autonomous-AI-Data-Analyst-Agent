<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Canvas: Pure Neutral Charcoal & Deep Obsidian Black -->
    <linearGradient id="mono-dark-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="50%" stop-color="#0E0E10"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>

    <!-- Circle 1: Dominant Center-Left Circle (cx: 740, cy: 330, r: 540) -->
    <linearGradient id="mono-grad-c1" x1="20%" y1="10%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#E2E2E6" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#7B7B82" stop-opacity="0.11"/>
      <stop offset="85%" stop-color="#2D2D31" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#121214" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Circle 2: Large Center-Right Circle (cx: 1140, cy: 280, r: 490) -->
    <linearGradient id="mono-grad-c2" x1="80%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#C8C8CE" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#64646B" stop-opacity="0.09"/>
      <stop offset="90%" stop-color="#222226" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0E0E10" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Circle 3: Far Upper-Right Circle (cx: 1680, cy: 160, r: 480) -->
    <linearGradient id="mono-grad-c3" x1="75%" y1="10%" x2="20%" y2="90%">
      <stop offset="0%" stop-color="#ABABAF" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#4C4C52" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#141416" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Circle 4: Giant Lower-Right Circle (cx: 1540, cy: 960, r: 550) -->
    <linearGradient id="mono-grad-c4" x1="20%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#D0D0D6" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#6E6E75" stop-opacity="0.09"/>
      <stop offset="85%" stop-color="#27272B" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0E0E10" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Circle 5: Focal Medium Floating Circle (cx: 1360, cy: 580, r: 185) -->
    <linearGradient id="mono-grad-c5" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#EEEEF2" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#909099" stop-opacity="0.14"/>
      <stop offset="85%" stop-color="#35353A" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#161618" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Circle 6: Lower-Left Intersecting Circle (cx: 90, cy: 520, r: 185) -->
    <linearGradient id="mono-grad-c6" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#E0E0E6" stop-opacity="0.19"/>
      <stop offset="50%" stop-color="#7E7E86" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#202024" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Circle 7: Upper-Left Large Arc Circle (cx: -60, cy: 230, r: 380) -->
    <linearGradient id="mono-grad-c7" x1="60%" y1="15%" x2="20%" y2="85%">
      <stop offset="0%" stop-color="#BCBCC2" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#55555B" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#18181A" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Circle 8: Bottom-Center Sweeping Arc (cx: 620, cy: 960, r: 430) -->
    <linearGradient id="mono-grad-c8" x1="30%" y1="10%" x2="75%" y2="85%">
      <stop offset="0%" stop-color="#A8A8AE" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#4B4B50" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#121214" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Crescent Gradient for Lower Intersection Lens (Circle 1 & Circle 2) -->
    <linearGradient id="mono-grad-lens12" x1="25%" y1="30%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#DFDFE5" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#7B7B83" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#252528" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Crescent Gradient for Left Intersection Lens (Circle 6 & Circle 7) -->
    <linearGradient id="mono-grad-lens67" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#EAEAEF" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#808088" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#242427" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Clip Paths for Precise Intersecting Lenses -->
    <clipPath id="clip-circle-1">
      <circle cx="740" cy="330" r="540"/>
    </clipPath>
    <clipPath id="clip-circle-6">
      <circle cx="90" cy="520" r="185"/>
    </clipPath>
    <clipPath id="clip-circle-4">
      <circle cx="1540" cy="960" r="550"/>
    </clipPath>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="100%" height="100%" fill="url(#mono-dark-canvas)"/>

  <!-- 2. Far Background Layer: Top-Right and Upper-Left Circles -->
  <!-- Circle 3: Far Upper-Right -->
  <circle cx="1680" cy="160" r="480" fill="url(#mono-grad-c3)"/>
  <circle cx="1680" cy="160" r="480" fill="none" stroke="#A8A8AE" stroke-width="1.2" stroke-opacity="0.09"/>

  <!-- Circle 7: Upper-Left Large Arc -->
  <circle cx="-60" cy="230" r="380" fill="url(#mono-grad-c7)"/>
  <circle cx="-60" cy="230" r="380" fill="none" stroke="#B8B8BE" stroke-width="1.2" stroke-opacity="0.10"/>

  <!-- Circle 8: Bottom-Center Base Arc -->
  <circle cx="620" cy="960" r="430" fill="url(#mono-grad-c8)"/>
  <circle cx="620" cy="960" r="430" fill="none" stroke="#9A9A9F" stroke-width="1.2" stroke-opacity="0.08"/>

  <!-- 3. Mid-Deep Layer: Giant Circle 4 (Bottom-Right) -->
  <circle cx="1540" cy="960" r="550" fill="url(#mono-grad-c4)"/>
  <circle cx="1540" cy="960" r="550" fill="none" stroke="#BEBEC4" stroke-width="1.5" stroke-opacity="0.12"/>

  <!-- 4. Upper Center-Right Layer: Circle 2 -->
  <circle cx="1140" cy="280" r="490" fill="url(#mono-grad-c2)"/>
  <circle cx="1140" cy="280" r="490" fill="none" stroke="#B4B4BA" stroke-width="1.5" stroke-opacity="0.11"/>

  <!-- 5. Dominant Center-Left Layer: Circle 1 -->
  <circle cx="740" cy="330" r="540" fill="url(#mono-grad-c1)"/>
  <circle cx="740" cy="330" r="540" fill="none" stroke="#C8C8CE" stroke-width="1.5" stroke-opacity="0.14"/>

  <!-- 6. Intersecting Lens: Intersection of Circle 1 & Circle 2 -->
  <g clip-path="url(#clip-circle-1)">
    <circle cx="1140" cy="280" r="490" fill="url(#mono-grad-lens12)"/>
    <circle cx="1140" cy="280" r="490" fill="none" stroke="#D5D5DC" stroke-width="1.2" stroke-opacity="0.13"/>
  </g>

  <!-- 7. Left Intersecting Circles: Circle 6 & its Lens with Circle 7 -->
  <circle cx="90" cy="520" r="185" fill="url(#mono-grad-c6)"/>
  <circle cx="90" cy="520" r="185" fill="none" stroke="#D2D2D8" stroke-width="1.4" stroke-opacity="0.15"/>
  <g clip-path="url(#clip-circle-6)">
    <circle cx="-60" cy="230" r="380" fill="url(#mono-grad-lens67)"/>
    <circle cx="-60" cy="230" r="380" fill="none" stroke="#E2E2E8" stroke-width="1.2" stroke-opacity="0.14"/>
  </g>

  <!-- 8. Focal Floating Circle 5 (Center-Right Intersection) -->
  <circle cx="1360" cy="580" r="185" fill="url(#mono-grad-c5)"/>
  <circle cx="1360" cy="580" r="185" fill="none" stroke="#E8E8EE" stroke-width="1.5" stroke-opacity="0.18"/>

  <!-- Subtle overlapping depth segment under Circle 5 crossing Circle 4 -->
  <g clip-path="url(#clip-circle-4)">
    <circle cx="1360" cy="580" r="185" fill="#AAAAAF" fill-opacity="0.05"/>
  </g>

</svg>
