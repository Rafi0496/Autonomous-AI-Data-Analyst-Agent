<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Top-Left Circle Gradient: Translucent Silver-Grey for Dark Theme -->
    <linearGradient id="grad-tl-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" stop-opacity="0.50"/>
      <stop offset="50%" stop-color="#1E1E22" stop-opacity="0.25"/>
      <stop offset="85%" stop-color="#141416" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0E0E10" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Bottom-Right Circle Gradient: Translucent Silver-Grey for Dark Theme -->
    <linearGradient id="grad-br-dark" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#27272A" stop-opacity="0.50"/>
      <stop offset="50%" stop-color="#1E1E22" stop-opacity="0.25"/>
      <stop offset="85%" stop-color="#141416" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0E0E10" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- 1. Background Canvas: Pure Neutral Obsidian -->
  <rect width="100%" height="100%" fill="#09090B"/>

  <!-- 2. Circle 1: Top-Left Half Circle meeting at center (cx: 0, cy: 0, r: 1101.5) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 6,4; 0,0" dur="12s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <circle cx="0" cy="0" r="1101.5" fill="url(#grad-tl-dark)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.6"/>
  </g>

  <!-- 3. Circle 2: Bottom-Right Half Circle meeting at center (cx: 1920, cy: 1080, r: 1101.5) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -6,-4; 0,0" dur="12s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <circle cx="1920" cy="1080" r="1101.5" fill="url(#grad-br-dark)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.6"/>
  </g>
</svg>
