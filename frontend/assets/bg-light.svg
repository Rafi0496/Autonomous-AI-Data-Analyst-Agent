<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Pristine Pure White Background Canvas (Zero Muddy or Blue Tint) -->
    <linearGradient id="pure-white-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Gaussian Blur Filters for Soft Luminous Glass Glow on White -->
    <filter id="glass-glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glass-glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambient-shadow-light" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <!-- 1. Rose / Coral Frosted Glass Sphere Radial Gradient -->
    <radialGradient id="rose-glass-grad" cx="68%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#FDA4AF" stop-opacity="0.80"/>
      <stop offset="25%" stop-color="#FB7185" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#F43F5E" stop-opacity="0.45"/>
      <stop offset="80%" stop-color="#FFE4E6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </radialGradient>

    <!-- Rose Specular Rim Gradient (Top-Right Arc) -->
    <linearGradient id="rose-rim-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#F43F5E" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#FFE4E6" stop-opacity="0.90"/>
    </linearGradient>

    <!-- 2. Sapphire / Periwinkle Frosted Glass Sphere Radial Gradient -->
    <radialGradient id="periwinkle-glass-grad" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.85"/>
      <stop offset="20%" stop-color="#60A5FA" stop-opacity="0.70"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.50"/>
      <stop offset="75%" stop-color="#E0E7FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </radialGradient>

    <!-- Periwinkle Specular Rim Gradient (Upper Arc) -->
    <linearGradient id="periwinkle-rim-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#C7D2FE" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.90"/>
    </linearGradient>

    <!-- 3. Upper Top-Left Peeking Orb Gradient -->
    <radialGradient id="top-glass-grad" cx="50%" cy="85%" r="65%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.70"/>
      <stop offset="35%" stop-color="#93C5FD" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#E0F2FE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </radialGradient>

    <linearGradient id="top-glass-rim-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1.0"/>
    </linearGradient>

    <!-- Subtle Ambient Caustics Bloom on White -->
    <radialGradient id="caustic-ambient-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#F472B6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <!-- 1. Pure Crisp White Canvas -->
  <rect width="100%" height="100%" fill="url(#pure-white-bg)"/>

  <!-- Ambient Light Bloom behind the intersection -->
  <circle cx="960" cy="540" r="600" fill="url(#caustic-ambient-light)"/>

  <!-- 2. Orb 1: Upper-Left Peeking Glass Orb (cx: 460, cy: -60, r: 420) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 6,4; -3,2; 0,0" dur="18s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"/>
    
    <!-- Body -->
    <circle cx="460" cy="-60" r="420" fill="url(#top-glass-grad)"/>

    <!-- Luminous Edge Rim -->
    <path d="M 120 180 A 420 420 0 0 0 880 -60" fill="none" stroke="url(#top-glass-rim-grad)" stroke-width="3.5" filter="url(#glass-glow-cyan)"/>
    <path d="M 120 180 A 420 420 0 0 0 880 -60" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.95"/>
  </g>

  <!-- 3. Orb 2: Dominant Sapphire / Periwinkle Frosted Glass Orb (Right & Bottom-Right) -->
  <g filter="url(#ambient-shadow-light)">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -10,-7; 5,-4; 0,0" dur="16s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- Sphere Body (cx: 1420, cy: 780, r: 640) -->
    <circle cx="1420" cy="780" r="640" fill="url(#periwinkle-glass-grad)"/>

    <!-- Inner Refraction Depth Ring -->
    <circle cx="1420" cy="780" r="622" fill="none" stroke="rgba(255, 255, 255, 0.40)" stroke-width="1.4"/>

    <!-- Luminous Neon Cyan-White Rim Light along the upper curved crest -->
    <path d="M 780 780 A 640 640 0 0 1 1980 440" fill="none" stroke="url(#periwinkle-rim-grad)" stroke-width="4.5" filter="url(#glass-glow-cyan)"/>
    <path d="M 780 780 A 640 640 0 0 1 1980 440" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- 4. Orb 3: Dominant Rose / Coral Frosted Glass Orb (Center-Left) -->
  <g filter="url(#ambient-shadow-light)">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 10,7; -5,4; 0,0" dur="16s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- Sphere Body (cx: 460, cy: 460, r: 520) -->
    <circle cx="460" cy="460" r="520" fill="url(#rose-glass-grad)"/>

    <!-- Inner Refraction Depth Ring -->
    <circle cx="460" cy="460" r="504" fill="none" stroke="rgba(255, 255, 255, 0.50)" stroke-width="1.4"/>

    <!-- Razor-Sharp Luminous Rose-White Rim Light along the upper-right arc -->
    <path d="M 160 880 A 520 520 0 0 0 980 460" fill="none" stroke="url(#rose-rim-grad)" stroke-width="4.8" filter="url(#glass-glow-rose)"/>
    <path d="M 160 880 A 520 520 0 0 0 980 460" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
