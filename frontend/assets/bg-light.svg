<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Layer 1: Faint fine dot grid (1px dots, 3.5% opacity, 24px pitch) -->
    <pattern id="dot-grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#1D1C1A" fill-opacity="0.035"/>
    </pattern>
  </defs>

  <!-- Background Base Tint (Cement #EAE9E5) -->
  <rect width="100%" height="100%" fill="#EAE9E5"/>

  <!-- Layer 1 Grid Pattern -->
  <rect width="100%" height="100%" fill="url(#dot-grid-light)"/>

  <!-- Layer 2: Large Organic Flat Pastel Shapes & Contour Arcs (6-8% opacity, zero blur) -->
  <!-- Top-Right Pastel Sage Organic Blob -->
  <path d="M 1320 0 C 1460 70, 1620 40, 1740 130 C 1840 205, 1900 330, 1920 420 L 1920 0 Z"
        fill="#9DBFA8" fill-opacity="0.08"/>
  <path d="M 1380 0 C 1510 60, 1660 30, 1780 120 C 1870 185, 1910 280, 1920 360"
        fill="none" stroke="#9DBFA8" stroke-width="1.5" stroke-opacity="0.09"/>

  <!-- Bottom-Left Dusty Blue Organic Arc & Contour -->
  <path d="M 0 680 C 120 670, 240 730, 310 820 C 390 920, 380 1020, 360 1080 L 0 1080 Z"
        fill="#9DB4D3" fill-opacity="0.08"/>
  <path d="M 0 740 C 100 730, 200 780, 260 860 C 330 950, 320 1030, 300 1080"
        fill="none" stroke="#9DB4D3" stroke-width="1.5" stroke-opacity="0.10"/>

  <!-- Top-Left Soft Sand Gentle Contour -->
  <path d="M 0 120 C 90 110, 180 150, 250 210 C 330 280, 360 380, 340 460 C 310 570, 210 620, 110 610 C 50 605, 10 590, 0 570 Z"
        fill="#DCC9A3" fill-opacity="0.075"/>
  <path d="M 0 170 C 80 160, 160 195, 220 250 C 290 310, 320 400, 300 470"
        fill="none" stroke="#DCC9A3" stroke-width="1.5" stroke-opacity="0.09"/>

  <!-- Middle-Right Soft Lavender Contour Arc -->
  <path d="M 1520 600 C 1620 580, 1720 620, 1810 680 C 1880 730, 1920 810, 1920 890 C 1920 980, 1860 1040, 1790 1080 L 1450 1080 C 1470 960, 1430 840, 1450 740 C 1465 670, 1480 610, 1520 600 Z"
        fill="#B9AEDB" fill-opacity="0.07"/>
  <path d="M 1560 640 C 1650 620, 1740 660, 1820 710 C 1880 750, 1920 820, 1920 890"
        fill="none" stroke="#B9AEDB" stroke-width="1.5" stroke-opacity="0.08"/>

  <!-- Center-Right Subtle Rose-Mist Accent Path -->
  <path d="M 1120 380 C 1220 360, 1310 410, 1370 480 C 1430 550, 1430 640, 1390 710 C 1350 780, 1260 820, 1180 810 C 1110 800, 1050 750, 1030 680 C 1010 610, 1030 540, 1060 480 C 1080 430, 1090 390, 1120 380 Z"
        fill="#D9B1B8" fill-opacity="0.055"/>
</svg>
