<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Top-Left Circle Gradient: Soft Crisp Silver Mist fading into Pure White -->
    <linearGradient id="grad-tl-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F1F3" stop-opacity="0.90"/>
      <stop offset="45%" stop-color="#F5F6F8" stop-opacity="0.60"/>
      <stop offset="85%" stop-color="#FAFAFB" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Bottom-Right Circle Gradient: Soft Crisp Silver Mist fading into Pure White -->
    <linearGradient id="grad-br-light" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F0F1F3" stop-opacity="0.90"/>
      <stop offset="45%" stop-color="#F5F6F8" stop-opacity="0.60"/>
      <stop offset="85%" stop-color="#FAFAFB" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- 1. Pure Crisp White Canvas (Zero Blue or Muddy Tint) -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- 2. Circle 1: Top-Left Half Circle meeting at center (cx: 0, cy: 0, r: 1101.5) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 6,4; 0,0" dur="12s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <circle cx="0" cy="0" r="1101.5" fill="url(#grad-tl-light)" stroke="#D1D5DB" stroke-width="1.6" stroke-opacity="0.55"/>
  </g>

  <!-- 3. Circle 2: Bottom-Right Half Circle meeting at center (cx: 1920, cy: 1080, r: 1101.5) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -6,-4; 0,0" dur="12s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <circle cx="1920" cy="1080" r="1101.5" fill="url(#grad-br-light)" stroke="#D1D5DB" stroke-width="1.6" stroke-opacity="0.55"/>
  </g>
</svg>
